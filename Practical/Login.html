<html>

<head>
    <title>Login - Random College</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <h1>Random College</h1>

            <h2>Student Login</h2>

            <p>
                Welcome back! Please enter your details
                to access your student account.
            </p>

            <hr>

            <form onsubmit="return validateLogin()">

                <label><b>Username</b></label>
                <br>

                <input type="text"
                       id="username"
                       placeholder="Enter your username"
                       required>

                <br><br>

                <label><b>Password</b></label>
                <br>

                <input type="password"
                       id="password"
                       placeholder="Enter your password"
                       required>

                <br><br>

                <button type="submit">Login</button>

            </form>

            <p class="login-note">
                Students can use their registered college
                credentials to access their account.
            </p>

        </div>

    </div>


    <script>

        function validateLogin() {

            let usernameInput =
                document.getElementById("username").value;

            let correctusername = "sksm";


            let passwordInput =
                document.getElementById("password").value;

            let correctPassword = "sksm123";


            if (usernameInput === correctusername &&
                passwordInput === correctPassword) {

                alert("Login successful!");

                window.location.href = "index.html";

                return false;

            } else {

                alert("Incorrect username or password. Please try again.");

                return false;
            }

        }

    </script>

</body>

</html>
